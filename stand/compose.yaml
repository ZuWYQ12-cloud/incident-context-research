name: incident-stand

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: production
      POSTGRES_USER: stand_admin
      POSTGRES_PASSWORD: local_demo_password
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stand_admin -d production"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  api:
    build:
      context: ./app
    environment:
      DATABASE_URL: postgresql://stand_admin:local_demo_password@db:5432/production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0

volumes:
  postgres_data:
